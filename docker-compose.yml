services:
  postgres:
    profiles: [ec2]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: release_sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - sentinel-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d release_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 20
  kafka:
    profiles: [ec2]
    image: apache/kafka:4.2.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:--Xms128m -Xmx256m}
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    profiles: [ec2]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
      - "127.0.0.1:${MANAGEMENT_PORT:-8081}:8081"
    environment:
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx256m}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: jdbc:postgresql://postgres:5432/release_sentinel
      DATABASE_USER: sentinel
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Set GITHUB_WEBHOOK_SECRET}
      GITHUB_READ_TOKEN: ${GITHUB_READ_TOKEN:-}
      SENTINEL_API_TOKENS: '${SENTINEL_API_TOKENS:-{}}'
      SENTINEL_CI_TOKENS: '${SENTINEL_CI_TOKENS:-{}}'
      SENTINEL_AGENT_URL: ${SENTINEL_AGENT_URL-http://host.docker.internal:11434/api/chat}
      SENTINEL_AGENT_MODEL: ${SENTINEL_AGENT_MODEL:-qwen3:8b}
      SENTINEL_REVIEW_URL: ${SENTINEL_REVIEW_URL:-http://host.docker.internal:11434/api/chat}
      SENTINEL_REVIEW_MODEL: ${SENTINEL_REVIEW_MODEL:-qwen3:8b}
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  sentinel-postgres:
